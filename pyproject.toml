[project]
name = "patrons-app"
version = "0.1.0"
description = "Personal sewing pattern catalogue: search, size recommendation and pattern ingestion."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "granian>=2.8.8",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]  # Django declares Meta/admin options as mutable class attributes

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]  # staticfiles/ only exists after collectstatic

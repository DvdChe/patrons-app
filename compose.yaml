# Local development services. Run the app itself with `uv run python manage.py runserver`.
name: patrons-app  # shared by all worktrees (one dev database)
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: patrons
      POSTGRES_PASSWORD: patrons
      POSTGRES_DB: patrons
    ports:
      - "5433:5432"  # 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrons"]
      interval: 2s
      retries: 30

volumes:
  pgdata:

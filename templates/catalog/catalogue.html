{% extends "base.html" %}
{% load static %}
{% block head %}
<script defer src="{% static 'catalog/catalogue.js' %}"></script>
<script defer src="{% static 'vendor/alpine.min.js' %}"></script>
{% endblock %}
{% block body %}
<div x-data="catalogue" @keydown.escape.window="closeSheet()">
<header>
  <h1>Moteur de patrons</h1>
  <input id="q" x-model="q" @input="refresh()" placeholder="Rechercher (modèle, marque, type, détails, tissus, remarques)…">
  <span><span id="count" x-text="view.count"></span> résultat(s)</span>
  <label>Tri
    <select x-model="sort" @change="refresh()">
      <option value="name">Modèle A-Z</option>
      <option value="brand">Marque</option>
      <option value="yardage">Métrage croissant</option>
    </select>
  </label>
  <button type="button" @click="reset()">Réinitialiser les filtres</button>
  <a class="add" href="{% url 'ingestion:upload' %}">＋ Ajouter un patron</a>
  <div class="user">
    <a href="{% url 'dataset:index' %}">Audit</a>
    {{ user.get_username }}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Se déconnecter</button></form>
  </div>
</header>

<div class="wrap">
<aside>
  <h3>Mes mensurations</h3>
  <div class="row">
    <select x-model.number="profileId" @change="selectProfile()">
      <template x-for="p in profiles" :key="p.id"><option :value="p.id" x-text="p.name" :selected="p.id === profileId"></option></template>
    </select>
    <button type="button" title="Nouveau profil" @click="newProfile()">+</button>
    <button type="button" @click="renameProfile()">Renommer</button>
    <button type="button" @click="deleteProfile()">Supprimer</button>
  </div>
  <div class="meas" style="margin-top:6px">
    <template x-for="m in MEASURES" :key="m.key">
      <div style="display:contents">
        <span x-text="m.label + ' (cm)'"></span>
        <input type="number" step="0.5" min="0" x-model="measures[m.key]" @input="queueSave()">
      </div>
    </template>
  </div>
  <div class="disc" x-text="profileMessage"></div>
  <label><input type="checkbox" x-model="fitOnly" @change="refresh()"> Dans mes mensurations</label>
  <label><input type="checkbox" x-model="chartOnly" @change="refresh()"> avec tableau de tailles seulement</label>

  <h3>Filtres</h3>
  <label>Marque<br>
    <select style="width:100%" x-model="brand" @change="refresh()">
      <option value="" x-text="'Toutes (' + facet('brand', '') + ')'"></option>
      <template x-for="b in brands" :key="b"><option :value="b" x-text="b + ' (' + facet('brand', b) + ')'"></option></template>
    </select>
  </label>
  <template x-for="f in SELECTS" :key="f.key">
    <label><span x-text="f.label"></span><br>
      <select style="width:100%" x-model="filters[f.key]" @change="refresh()">
        <option value="" x-text="f.all + ' (' + facet(f.key, '') + ')'"></option>
        <template x-for="c in choicesFor(f.key)" :key="c[0]"><option :value="c[0]" x-text="c[1] + ' (' + facet(f.key, c[0]) + ')'"></option></template>
      </select>
    </label>
  </template>
  <div style="margin:3px 0">Saison <span class="disc">(aucune case = toutes)</span>
    <div class="row">
      <template x-for="s in SEASONS" :key="s.value">
        <label><input type="checkbox" :value="s.value" x-model="seasons" @change="refresh()"> <span x-text="s.label + ' (' + (view.seasonCounts[s.value] ?? 0) + ')'"></span></label>
      </template>
    </div>
  </div>
  <label>Métrage maximum : <b x-text="maxYardage >= MMAX ? 'sans limite' : fmt(maxYardage) + ' m'"></b>
    <input type="range" min="0.5" max="6" step="0.1" style="width:100%" x-model.number="maxYardage" @input="refresh()">
  </label>
  <label><input type="checkbox" x-model="withThumb" @change="refresh()"> avec vignette seulement</label>

  <h3>Détails</h3>
  <div>
    <template x-for="[group, values] in Object.entries(tagGroups)" :key="group">
      <details open><summary x-text="group"></summary>
        <template x-for="v in values" :key="group + '|' + v">
          <span class="tg" :class="{on: tags.includes(group + '|' + v), zero: !view.tagCounts[group + '|' + v]}"
                @click="toggleTag(group + '|' + v)" x-text="v + ' (' + (view.tagCounts[group + '|' + v] || 0) + ')'"></span>
        </template>
      </details>
    </template>
  </div>
</aside>

<main>
  <div class="loading" x-show="loading">Chargement…</div>
  <template x-if="!loading">
    <div>
      <div class="pager" x-html="pagerHtml()" @click="pagerClick($event)"></div>
      <div id="grid">
        <template x-for="x in view.cards" :key="x.id">
          <div class="card" @click="openSheet(x.id)">
            <div class="th">
              <template x-if="x.thumb"><img loading="lazy" :src="x.thumb" alt=""></template>
              <template x-if="!x.thumb"><div class="ph">Pas de vignette</div></template>
            </div>
            <div class="cb">
              <b x-text="x.name"></b><span class="mut" x-text="x.brand"></span><br>
              <span x-text="x.type + (x.seasons_text ? ' · ' + x.seasons_text : '')"></span><br>
              <span class="mut met" x-text="x.yardage_text || 'métrage non précisé'"></span>
              <div class="mg" x-show="x.seam === 'included'">marges comprises</div>
              <div class="mg no" x-show="x.seam === 'not_included'">marges non comprises</div>
              <div class="sewn-badge" x-show="x.sewn">✓ cousu</div>
              <div class="rec" :class="{na: rec(x).muted}" x-show="rec(x).text" x-text="rec(x).text"></div>
            </div>
          </div>
        </template>
      </div>
      <div class="pager" x-html="pagerHtml()" @click="pagerClick($event)"></div>
    </div>
  </template>
</main>
</div>

<div id="modal" x-cloak x-show="sheetOpen" @click.self="closeSheet()">
  <div class="box"><button class="x" type="button" @click="closeSheet()">×</button><div x-html="sheetHtml"></div></div>
</div>
</div>
{% endblock %}
